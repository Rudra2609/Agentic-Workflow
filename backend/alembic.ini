# Alembic config for hmap (Sprint 1 item 1.5). Run from backend/:
#   uv run alembic upgrade head                 # uses $HMAP_DATABASE_URL (default: local dev database)
#   uv run alembic -x schema=myschema upgrade head
# The app can migrate on start with hmap.db.migrate.upgrade() / upgrade_async().
# Member migrations are named alembic/versions/00<member>_*.py and chain on the previous revision.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is NOT set here: env.py reads HMAP_DATABASE_URL (never commit credentials)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
