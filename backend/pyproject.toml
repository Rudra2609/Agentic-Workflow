[project]
name = "hmap"
version = "0.1.0"
description = "Hierarchical multi-agent AI project execution platform (IT-314 Group 23)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "aio-pika>=9.4",
    "python-multipart>=0.0.9",
    # document intelligence (Member 2, Sprint 2): PDF text/tables, page rendering, DOCX, OCR. Tesseract itself is a
    # system binary (`brew install tesseract`); without it OCR falls back to the vision model or reports the page.
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "pytesseract>=0.3.13",
    "Pillow>=10.4",
    "networkx==3.6.1",
    # observability (Member 4, Sprint 4): traces to Jaeger over OTLP/HTTP (off unless HMAP_OTEL_ENDPOINT is set),
    # Prometheus /metrics, process + system RAM
    "opentelemetry-api>=1.45,<1.46",
    "opentelemetry-sdk>=1.45,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<1.46",
    "prometheus-client>=0.26,<0.27",
    "psutil>=7.2,<8",
]

[project.optional-dependencies]
# LangGraph is optional per agent (doc 01 §3); only the coding agent is expected to use it.
coding = ["langgraph>=0.2"]

[project.scripts]
hmap-agents = "hmap.core.runtime.host:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.22",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.2",
    "hypothesis>=6.169.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Docker infra (make infra-up); skipped when it is not running",
    "slow: long-running or real-model tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hmap.core.*"
strict = true
