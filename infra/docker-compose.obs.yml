# hmap observability stack (Sprint 4, Member 4, plan D13-D16). Separate from the main infra and optional:
#   make obs-up      -> Jaeger (traces), Prometheus (metrics + alert rules), Grafana (dashboard), waits until healthy
#   make obs-down
#   make obs-open    -> opens the three UIs
# The app sends traces only when HMAP_OTEL_ENDPOINT=http://127.0.0.1:4318 is set (make obs-up prints the line).
# Everything binds to 127.0.0.1 and is memory-capped (16 GB laptop). Configs are COPY'd into small images instead of
# bind-mounted: Colima only shares $HOME and the repository may live elsewhere (see infra/docker-compose.yml).
name: hmap-obs

services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0          # v2 all-in-one: OTLP receivers + in-memory storage + UI
    ports:
      - "127.0.0.1:16686:16686"                 # UI: http://127.0.0.1:16686
      - "127.0.0.1:4317:4317"                   # OTLP gRPC
      - "127.0.0.1:4318:4318"                   # OTLP HTTP (what hmap uses)
    environment:
      MEMORY_MAX_TRACES: "20000"
    deploy:
      resources:
        limits: {memory: 256m}
    restart: unless-stopped

  prometheus:
    build: observability/prometheus
    image: hmap-prometheus:local
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=256MB
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]              # UI + alerts: http://127.0.0.1:9090/alerts
    extra_hosts: ["host.docker.internal:host-gateway"]   # the API / agents run natively on the host
    volumes:
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: {memory: 256m}
    restart: unless-stopped

  grafana:
    build: observability/grafana
    image: hmap-grafana:local
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # viewers need no login (local demo); admin keeps a password
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${HMAP_GRAFANA_PASSWORD:?set HMAP_GRAFANA_PASSWORD (make obs-up generates one)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hmap.json
    ports: ["127.0.0.1:3001:3000"]               # http://127.0.0.1:3001 (3000 is the dashboard's dev server)
    depends_on: [prometheus, jaeger]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    deploy:
      resources:
        limits: {memory: 256m}
    restart: unless-stopped

volumes:
  promdata:
