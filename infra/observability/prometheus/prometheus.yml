# Scrapes the hmap processes running natively on the host (doc 02 §3): the API (make api: 8000; demos: 8767) and the
# separate agents process (hmap-agents run: HMAP_METRICS_PORT, default 9464). A target that is not running is simply
# "down". Queue depths come from the platform's own sampler (bus.queue_depths), so RabbitMQ needs no exporter.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hmap-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000", "host.docker.internal:8767"]
  - job_name: hmap-agents
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
